name: Build SkinAI iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skinai-ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Build SkinAI for iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Find Flutter project automatically
      - name: Detect Flutter project
        id: flutter_project
        shell: bash
        run: |
          echo "Searching for Flutter project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/lib/main.dart" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type d \( -name .git -o -name build -o -name .dart_tool \) -prune \
              -o -type f -name pubspec.yaml -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found!"
            echo "Available pubspec.yaml files:"
            find . -name pubspec.yaml -not -path "*/build/*"
            exit 1
          fi

          echo "Flutter project found: $PROJECT_DIR"
          echo "directory=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 4. Disable Swift Package Manager (avoids the SPM migration error)
      - name: Disable Swift Package Manager
        run: |
          flutter config --no-enable-swift-package-manager

      # 5. Show project information
      - name: Show project information
        working-directory: ${{ steps.flutter_project.outputs.directory }}
        run: |
          echo "=== PROJECT INFORMATION ==="
          flutter --version
          echo "=== PUBSPEC ==="
          cat pubspec.yaml
          echo "=== LIB ==="
          ls -la lib/

      # 6. Install dependencies
      - name: Install Flutter dependencies
        working-directory: ${{ steps.flutter_project.outputs.directory }}
        run: |
          flutter pub get

      # 7. Check Flutter project (infos and warnings do not fail the build)
      - name: Analyze Flutter project
        working-directory: ${{ steps.flutter_project.outputs.directory }}
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      # 8. Build iOS without code signing
      - name: Build iOS (No Codesign)
        working-directory: ${{ steps.flutter_project.outputs.directory }}
        run: |
          flutter build ios --release --no-codesign

      # 9. Create IPA from Runner.app
      - name: Create IPA
        working-directory: ${{ steps.flutter_project.outputs.directory }}
        shell: bash
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not generated!"
            find build/ios -maxdepth 3 -type d
            exit 1
          fi

          rm -rf Payload SkinAI.ipa
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SkinAI.ipa Payload

          echo "=== IPA FILE ==="
          ls -lh SkinAI.ipa

      # 10. Upload IPA artifact
      - name: Upload SkinAI IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkinAI-iOS-IPA
          path: ${{ steps.flutter_project.outputs.directory }}/SkinAI.ipa
          if-no-files-found: error
          retention-days: 14

      # 11. Upload build logs if build fails
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SkinAI-iOS-Build-Diagnostics
          path: |
            **/build/ios/**/*.log
            **/build/ios/Flutter/*.xcconfig
          if-no-files-found: ignore
          retention-days: 7
