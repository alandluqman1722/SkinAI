name: skin_ai
description: "Skin AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  http_parser: ^4.0.2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.0.1
  cloud_firestore: ^7.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  video_player: ^2.11.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  crypto: ^3.0.8
  home_widget: 0.10.0
  url_launcher: ^6.3.3
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  image: 4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - gemini_generated_video_a4162dd9.mp4


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#050714"
  adaptive_icon_foreground: "assets/icon/logo.png"